# CI: app + tooling tests, the UI suite on three browsers, and the AI pipeline replayed from recordings.
# No job needs an API key: generation and triage run in replay mode (answers recorded locally with a key)
# or, in the sample job, on hand-written sample answers that are labelled as such in every report.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: App + AI tooling tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Install Chromium (the gate's own tests run drafts in a browser)
        run: ./mvnw -B -q compile exec:java -Dexec.mainClass=com.microsoft.playwright.CLI -Dexec.args="install --with-deps chromium"
      - name: Unit suite (app rules, API, gate rules, gate runs, gateway replay)
        run: ./mvnw -B test

  ui:
    name: UI tests (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Install ${{ matrix.browser }}
        run: ./mvnw -B -q compile exec:java -Dexec.mainClass=com.microsoft.playwright.CLI -Dexec.args="install --with-deps ${{ matrix.browser }}"
      - name: Hand-written and approved AI-drafted tests
        run: ./mvnw -B test -Dsuite=ui -Dbrowser=${{ matrix.browser }}
      - name: Keep the evidence of failed tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-evidence-${{ matrix.browser }}
          path: target/test-evidence/

  ai-replay:
    name: AI drafts replayed through today's gate
    # Once answers are recorded (locally, with a key): regenerates every approved AI test from its
    # recording and runs the full quality gate on it. If a prompt, the framework code or a test case
    # changed since recording, replay finds no matching recording and the job says what to re-record.
    runs-on: ubuntu-latest
    env:
      AI_MODE: replay
    steps:
      - uses: actions/checkout@v7
      # A job-level `if` cannot use hashFiles(), so a first step decides and the rest follow it.
      - name: Recordings present?
        id: rec
        run: |
          if ls ai/recordings/generate/*.json >/dev/null 2>&1; then echo "have=true" >> "$GITHUB_OUTPUT"
          else echo "have=false" >> "$GITHUB_OUTPUT"; echo "No generate recordings yet: nothing to replay." >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/setup-java@v6
        if: steps.rec.outputs.have == 'true'
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Install Chromium
        if: steps.rec.outputs.have == 'true'
        run: ./mvnw -B -q compile exec:java -Dexec.mainClass=com.microsoft.playwright.CLI -Dexec.args="install --with-deps chromium"
      - name: Regenerate approved AI tests from recordings and gate them
        if: steps.rec.outputs.have == 'true'
        run: ./ai.sh generate --approved
      - name: Review files to the job summary
        if: always() && steps.rec.outputs.have == 'true'
        run: cat ai-drafts/*/review.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

  triage-demo:
    name: AI triage of a planted product bug
    # Starts LeaveDesk with the overlap rule switched off, so the overlap test fails, then replays
    # Claude's triage of that failure. The job passes only if the verdict is PRODUCT_BUG.
    runs-on: ubuntu-latest
    env:
      AI_MODE: replay
    steps:
      - uses: actions/checkout@v7
      # A job-level `if` cannot use hashFiles(), so a first step decides and the rest follow it.
      - name: Recordings present?
        id: rec
        run: |
          if ls ai/recordings/triage/*.json >/dev/null 2>&1; then echo "have=true" >> "$GITHUB_OUTPUT"
          else echo "have=false" >> "$GITHUB_OUTPUT"; echo "No triage recordings yet: nothing to replay." >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/setup-java@v6
        if: steps.rec.outputs.have == 'true'
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Install Chromium
        if: steps.rec.outputs.have == 'true'
        run: ./mvnw -B -q compile exec:java -Dexec.mainClass=com.microsoft.playwright.CLI -Dexec.args="install --with-deps chromium"
      - name: UI suite against the app with the planted bug (failures expected)
        if: steps.rec.outputs.have == 'true'
        run: ./mvnw -B test -Dsuite=ui -Dleavedesk.bug=true || echo "Failures expected (the bug is planted)"
      - name: AI triage (replayed)
        if: steps.rec.outputs.have == 'true'
        run: ./ai.sh triage
      - name: Verdict must be PRODUCT_BUG
        if: steps.rec.outputs.have == 'true'
        run: |
          cat target/ai-triage/triage.md >> "$GITHUB_STEP_SUMMARY"
          grep -q '\*\*PRODUCT_BUG\*\*' target/ai-triage/triage.md
      - name: Keep evidence and triage
        if: always() && steps.rec.outputs.have == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: triage-demo
          path: |
            target/test-evidence/
            target/ai-triage/

  samples:
    name: Pipeline on hand-written sample answers
    # Everything around the model, on every push, without a key: ai/samples/ holds answers a person
    # wrote in Claude's answer shape (each file and each report says so). The gate, the repair loop,
    # the browser runs and the planted-bug failure are real; the AI answers are not.
    runs-on: ubuntu-latest
    env:
      AI_MODE: sample
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Install Chromium
        run: ./mvnw -B -q compile exec:java -Dexec.mainClass=com.microsoft.playwright.CLI -Dexec.args="install --with-deps chromium"
      - name: Gate the sample drafts (TC-104 fails the rules once, then passes after the repair round)
        run: ./ai.sh generate TC-103 TC-104
      - name: Put the TC-104 sample test in the suite for this job only (never committed)
        run: |
          mkdir -p src/test/java/com/niranjankagri/aitesting/tests/ai
          cp ai-drafts/TC-104/OverlappingRequestTest.java src/test/java/com/niranjankagri/aitesting/tests/ai/
      - name: UI suite against the app with the planted overlap bug (one failure expected)
        run: ./mvnw -B test -Dsuite=ui -Dleavedesk.bug=true || echo "Failure expected (the bug is planted)"
      - name: The failure was really captured
        run: test -f target/test-evidence/OverlappingRequestTest.overlappingSickLeaveIsRefused/failure.json
      - name: Triage with the sample verdict
        run: ./ai.sh triage
      - name: Review pages and triage report to the job summary
        if: always()
        run: |
          cat ai-drafts/*/review.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          cat target/ai-triage/triage.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
      - name: Keep drafts, evidence and triage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sample-pipeline
          path: |
            ai-drafts/
            target/test-evidence/
            target/ai-triage/
