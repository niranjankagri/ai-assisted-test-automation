# Keeps dependencies and CI actions current (security alerts are on separately). Once a month,
# minor and patch updates are grouped into one pull request per ecosystem and folder; a major
# version comes as its own pull request and is reviewed before merging. CI checks every update.
version: 2
updates:
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: monthly
    groups:
      maven-minor-patch:
        update-types: [minor, patch]
    ignore:
      # Surefire 3.6 removed suiteXmlFiles, which runs this project's TestNG suites
      # (PR #3 failed: "Parameter suiteXmlFiles is not supported since 3.6.0")
      - dependency-name: org.apache.maven.plugins:maven-surefire-plugin
        versions: [">= 3.6.0"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      github-actions-minor-patch:
        update-types: [minor, patch]
